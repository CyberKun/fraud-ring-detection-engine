syntax = "proto3";
package fraud.rpc;

enum AckMode { QUORUM=0; ASYNC=1; }
message ProducerSequence { uint64 producer_id = 1; uint64 sequence = 2; }
message UpsertEdgeRequest { uint64 tenant_id=1; uint64 u=2; uint64 v=3; uint32 edge_type=4; uint64 expiry_ms=5; ProducerSequence source=6; AckMode mode=7; }
message DeleteEdgeRequest { uint64 tenant_id=1; uint64 u=2; uint64 v=3; uint32 edge_type=4; ProducerSequence source=5; AckMode mode=6; }
message UpdateVertexRequest { uint64 tenant_id=1; uint64 vertex_id=2; uint64 volume=3; bool is_flagged=4; ProducerSequence source=5; AckMode mode=6; }
message MutationResponse { uint64 epoch=1; uint64 applied_lsn=2; bool alert_triggered=3; bool duplicate=4; }
message ConnectedRequest { uint64 tenant_id=1; uint64 u=2; uint64 v=3; optional uint64 min_lsn=4; }
message ConnectedResponse { bool connected=1; uint64 applied_lsn=2; string replica_role=3; }
message ComponentStatsRequest { uint64 tenant_id=1; uint64 vertex_id=2; optional uint64 min_lsn=3; }
message ComponentStatsResponse { uint64 vertex_count=1; uint64 account_count=2; uint64 volume=3; uint64 flagged_accounts=4; double flagged_ratio=5; uint64 applied_lsn=6; string replica_role=7; }
message SubgraphRequest { uint64 tenant_id=1; uint64 vertex_id=2; uint32 max_nodes=3; optional uint64 min_lsn=4; }
enum EntityType { ACCOUNT=0; CARD=1; DEVICE=2; }
message Vertex { uint64 vertex_id=1; EntityType entity_type=2; uint64 volume=3; bool is_flagged=4; }
message Edge { uint64 u=1; uint64 v=2; uint32 edge_type=3; uint64 handle=4; uint64 version=5; uint64 expiry_ms=6; }
message SubgraphResponse { repeated Vertex vertices=1; repeated Edge edges=2; bool truncated=3; uint64 total_vertices=4; uint64 applied_lsn=5; string replica_role=6; }
message SubscribeAlertsRequest { uint64 tenant_id=1; }
message AlertEvent { uint64 tenant_id=1; uint64 vertex_id=2; uint64 epoch=3; uint64 lsn=4; uint64 event_time_ms=5; ComponentStatsResponse stats=6; }
message AuditAtRequest { uint64 tenant_id=1; uint64 vertex_id=2; uint64 timestamp_ms=3; uint32 max_nodes=4; optional uint64 min_lsn=5; }
message AuditAtResponse { ComponentStatsResponse stats=1; SubgraphResponse subgraph=2; optional uint64 first_alert_timestamp_ms=3; uint64 applied_lsn=4; string replica_role=5; }
message HealthRequest {bool checksum=1; }
message MemberHealth { string address=1; string replica_role=2; uint64 applied_lsn=3; uint64 epoch=4; uint64 lag=5; }
message DevStopRequest { uint32 shard_id=1; uint64 epoch=2; }
message DevStopResponse { uint64 epoch=1; }
message ShardHealth { repeated MemberHealth members=14; uint32 shard_id=1; string replica_role=2; uint64 epoch=3; uint64 applied_lsn=4; uint64 lag=5; double ingestion_rate=6; uint64 last_entry_epoch=7; uint64 last_lsn=8; uint64 commit_lsn=9; uint64 truncations=10; string checksum=11; string log_hash=12; uint64 fetched_frames=13; }
message ClusterHealthResponse { repeated ShardHealth shards=1; }
service FraudEngine {
 rpc DevStopLeader(DevStopRequest) returns (DevStopResponse);
 rpc UpsertEdge(UpsertEdgeRequest) returns (MutationResponse);
 rpc DeleteEdge(DeleteEdgeRequest) returns (MutationResponse);
 rpc UpdateVertex(UpdateVertexRequest) returns (MutationResponse);
 rpc Connected(ConnectedRequest) returns (ConnectedResponse);
 rpc ComponentStats(ComponentStatsRequest) returns (ComponentStatsResponse);
 rpc GetComponentSubgraph(SubgraphRequest) returns (SubgraphResponse);
 rpc SubscribeAlerts(SubscribeAlertsRequest) returns (stream AlertEvent);
 rpc AuditAt(AuditAtRequest) returns (AuditAtResponse);
 rpc GetClusterHealth(HealthRequest) returns (ClusterHealthResponse);
}

message Mark { uint64 index=1; uint64 epoch=2; uint64 lsn=3; string digest=4; }
enum PeerOp { PROMISE=0; PROBE=1; FETCH=2; APPEND=3; TRUNCATE=4; COMMIT=5; }
message PeerRequest { uint64 shard=1; string owner=2; uint64 epoch=3; PeerOp op=4;
 uint64 index=5; Mark previous=6; Mark boundary=7; bytes frame=8; uint64 leader_lsn=9; }
message PeerReply { Mark tail=1; Mark committed=2; Mark boundary=3; bytes frame=4; }
service ReplicaPeer { rpc DevStopLeader(DevStopRequest) returns (DevStopResponse); rpc Exchange(PeerRequest) returns (PeerReply); }

message KafkaMutation {
  oneof command {
    UpsertEdgeRequest upsert = 1;
    DeleteEdgeRequest remove = 2;
    UpdateVertexRequest update = 3;
  }
}
