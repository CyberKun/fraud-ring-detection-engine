apiVersion: v1
kind: Service
metadata: {name: shard-0}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: shard-0}
  ports: [{name: service, port: 5100, targetPort: 5100}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: shard-0}
spec:
  replicas: 3
  serviceName: shard-0
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: shard-0}}
  template:
    metadata: {labels: {app: shard-0}}
    spec:
      containers:
        - name: shard-0
          image: fraud-ring-phase9
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5100}]
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec ./build/fraud_replica /data 0 "${HOSTNAME##*-}" http://etcd:2379 3 1000
              shard-0-0.shard-0:5100 shard-0-1.shard-0:5100 shard-0-2.shard-0:5100 9100
          env:
            - {name: FRAUD_KAFKA_BROKERS, value: "broker:9092"}
          readinessProbe: {tcpSocket: {port: 5100}, periodSeconds: 3}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
